<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#253b53"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="15" fill="#152b43"><rect x="35" y="25" width="310" height="95" rx="7" fill="#f2f5f8" stroke="#253b53" stroke-width="1.5"/><text x="190" y="50" font-size="15" text-anchor="middle"><tspan x="190" dy="0">users</tspan><tspan x="190" dy="1.3em">PK id; UNIQUE username/email</tspan><tspan x="190" dy="1.3em">role, verified, session_version</tspan></text><rect x="540" y="25" width="325" height="95" rx="7" fill="#f2f5f8" stroke="#253b53" stroke-width="1.5"/><text x="702.5" y="50" font-size="15" text-anchor="middle"><tspan x="702.5" dy="0">matches</tspan><tspan x="702.5" dy="1.3em">PK id; nullable FK owner_user_id</tspan><tspan x="702.5" dy="1.3em">status, category, format, timestamps</tspan></text><rect x="260" y="230" width="390" height="100" rx="7" fill="#f2f5f8" stroke="#253b53" stroke-width="1.5"/><text x="455" y="255" font-size="15" text-anchor="middle"><tspan x="455" dy="0">match_participants</tspan><tspan x="455" dy="1.3em">PK id; FK user_id; FK match_id</tspan><tspan x="455" dy="1.3em">score, WPM, accuracy, rank</tspan><tspan x="455" dy="1.3em">end_reason, completed_words, lives</tspan></text><path d="M345 72L540 72" stroke="#253b53" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="442.5" y="64" font-size="12" text-anchor="middle"><tspan x="442.5" dy="0">0..1 owner : many matches</tspan></text><path d="M190 120L350 230" stroke="#253b53" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="270" y="167" font-size="12" text-anchor="middle"><tspan x="270" dy="0">user 1 : many participations</tspan></text><path d="M700 120L560 230" stroke="#253b53" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="630" y="1
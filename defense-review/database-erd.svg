" y="714" font-size="12.5">PK version; bookkeeping only</text><text x="450" y="768" font-size="14" text-anchor="middle"><tspan x="450" dy="0">No dedicated rooms, sessions, enrollments or Student Progress table.</tspan></text></g></svg>